# # Отримання автозавершення вводу команд з config-schema.json
# "$schema" = "file:///home/roman/.config/starship/config-schema.json"
#
# # Рядок праворуч
# right_format = """
# $time\
# $battery\
# """
#
# # Заміняти символ '❯' в командному рядку на символ  '➜'
# [character] # Назва модуля, який ми налаштовуємо – 'character'
# success_symbol = '[➜](bold green)' # Частина 'success_symbol' буде використовувати символ '➜' підсвічений значенням 'bold green'
# error_symbol = '[✗](bold red)'
#
# [directory]
# truncation_length = 8
# truncation_symbol = '…/'
# read_only = ' 🔒'
# truncate_to_repo = false

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                         STARSHIP CONFIGURATION                               │
# │                                                                              │
# │  Стиль: OneNord / Minimal / Developer                                       │
# │  Shell: Zsh                                                                  │
# │  Terminal: WezTerm                                                           │
# │  Schema: ~/.config/starship/config-schema.json                              │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# ───────────────────────────────────────────────────────────────────────────────
# JSON SCHEMA
# ───────────────────────────────────────────────────────────────────────────────
# Підключення Starship JSON Schema.
# Це дозволяє редакторам отримувати:
#   • автодоповнення параметрів;
#   • опис доступних опцій;
#   • перевірку значень;
#   • підказки при редагуванні конфігурації.
# У TOML шлях до schema задається як URL/file URI.
"$schema" = "file:///home/roman/.config/starship/config-schema.json"

# ───────────────────────────────────────────────────────────────────────────────
# GLOBAL SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
# Не показувати порожній рядок між prompt-блоками.
add_newline = true
# Максимальна кількість часу виконання команди,
# після якої показується duration.
command_timeout = 1000
# Максимальний час очікування для Starship.
scan_timeout = 30
# Символи, які використовуються Starship.
palette = "onenord"

# ───────────────────────────────────────────────────────────────────────────────
# FORMAT
# ───────────────────────────────────────────────────────────────────────────────
# Двохрядковий prompt:
#   󰣇 roman@roman-pc ~/project
#   →
# Перший рядок:
#   OS → username → hostname → directory → git
# Другий рядок:
#   статус → час → prompt character
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$custom\
$line_break\
$status\
$character"""
# Формат продовження prompt.
continuation_prompt = "▶ "

# ───────────────────────────────────────────────────────────────────────────────
# PALETTE — ONENORD
# ───────────────────────────────────────────────────────────────────────────────
# Палітра адаптована під OneNord.
# Використання:
#   style = "fg:color"
#   style = "fg:color bg:color"
[palettes.onenord]
nord0  = "#2E3440"
nord1  = "#3B4252"
nord2  = "#434C5E"
nord3  = "#4C566A"
nord4  = "#D8DEE9"
nord5  = "#E5E9F0"
nord6  = "#ECEFF4"
nord7  = "#8FBCBB"
nord8  = "#88C0D0"
nord9  = "#81A1C1"
nord10 = "#5E81AC"
nord11 = "#BF616A"
nord12 = "#D08770"
nord13 = "#EBCB8B"
nord14 = "#A3BE8C"
nord15 = "#B48EAD"

# ───────────────────────────────────────────────────────────────────────────────
# OS
# ───────────────────────────────────────────────────────────────────────────────
[os]
disabled = false
# Показуємо значок операційної системи.
format = "[$symbol]($style) "
style = "fg:nord8"

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
NixOS = "󱄅"
Windows = "󰍲"
Macos = "󰀵"

# ───────────────────────────────────────────────────────────────────────────────
# USERNAME
# ───────────────────────────────────────────────────────────────────────────────
[username]
show_always = true
format = "[$user]($style)"
style_user = "fg:nord7 bold"
style_root = "fg:nord11 bold"

# ───────────────────────────────────────────────────────────────────────────────
# HOSTNAME
# ───────────────────────────────────────────────────────────────────────────────
[hostname]
ssh_only = false
ssh_symbol = "󰣀 "
format = "[@$hostname]($style) "
style = "fg:nord7 bold"

# ───────────────────────────────────────────────────────────────────────────────
# DIRECTORY
# ───────────────────────────────────────────────────────────────────────────────
# При переході в HOME:
#   󰋜
# В інших директоріях:
#   󰉋 project
# truncation дозволяє не отримувати надто довгий prompt.

[directory]
truncation_length = 5
truncate_to_repo = false
home_symbol = "󰋜 "
read_only = " 󰌾 "
format = "[$path]($style)[$read_only]($read_only_style) "
style = "fg:nord9 bold"
read_only_style = "fg:nord11"

# ───────────────────────────────────────────────────────────────────────────────
# GIT BRANCH
# ───────────────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "fg:nord15"

# ───────────────────────────────────────────────────────────────────────────────
# GIT STATUS
# ───────────────────────────────────────────────────────────────────────────────
[git_status]
format = "([$all_status$ahead_behind]($style)) "
style = "fg:nord13"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
up_to_date = ""
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# ───────────────────────────────────────────────────────────────────────────────
# FILL
# ───────────────────────────────────────────────────────────────────────────────
# Заповнює вільний простір між Git і правою частиною prompt.
[fill]
symbol = " "

# ───────────────────────────────────────────────────────────────────────────────
# COMMAND DURATION
# ───────────────────────────────────────────────────────────────────────────────
# Показується тільки для команд, які виконувались довше
# за заданий threshold.
[cmd_duration]
min_time = 1000
format = "[$duration]($style) "
style = "fg:nord13"
show_milliseconds = false

# ───────────────────────────────────────────────────────────────────────────────
# PYTHON
# ───────────────────────────────────────────────────────────────────────────────
# [python]
# symbol = " "
# format = "[$symbol$pyenv_prefix($version )]($style)"
# style = "fg:nord14"
# pyenv_version_name = true
# python_binary = ["python", "python3"]
[custom.python]
command = "~/.config/starship/scripts/python.sh"
when = "true"
format = "[$output]($style) "
style = "fg:nord7 bold"
ignore_timeout = true
# ───────────────────────────────────────────────────────────────────────────────
# DOCKER
# ───────────────────────────────────────────────────────────────────────────────
[custom.docker]
description = "Docker Compose project status"
command = "~/.config/starship/scripts/docker-compose.sh"
when = """
test -f Dockerfile ||
test -f compose.yml ||
test -f compose.yaml ||
test -f docker-compose.yml ||
test -f docker-compose.yaml
"""
format = "[$output]($style) "
style = "fg:nord8 bold"
ignore_timeout = true

# ───────────────────────────────────────────────────────────────────────────────
# STATUS
# ───────────────────────────────────────────────────────────────────────────────
# Показує код завершення попередньої команди.
# Успішна команда:
#   ➜
# Помилка:
#   ✘ 1 ❯
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘"
success_symbol = ""
style = "fg:nord11 bold"
map_symbol = true

# ───────────────────────────────────────────────────────────────────────────────
# CHARACTER
# ───────────────────────────────────────────────────────────────────────────────
# Основний символ вводу.
# Успіх:
#   ➜
# Помилка:
#   ✘
# Vi command mode:
#   ❮
[character]
success_symbol = "[➜](bold fg:nord14)"
error_symbol = "[✘](bold fg:nord11)"
vimcmd_symbol = "[❮](bold fg:nord13)"
vimcmd_replace_one_symbol = "[❮](bold fg:nord15)"
vimcmd_replace_symbol = "[❮](bold fg:nord15)"
vimcmd_visual_symbol = "[❮](bold fg:nord8)"

# ───────────────────────────────────────────────────────────────────────────────
# SHELL
# ───────────────────────────────────────────────────────────────────────────────
# Shell module можна увімкнути, якщо потрібно показувати Zsh.
# Зараз вимкнений, щоб prompt залишався чистим.
[shell]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# TIME
# ───────────────────────────────────────────────────────────────────────────────
[time]
disabled = true
format = "[$time]($style) "
style = "fg:nord4"
time_format = "%H:%M:%S"

# ───────────────────────────────────────────────────────────────────────────────
# JOBS
# ───────────────────────────────────────────────────────────────────────────────
[jobs]
symbol = "✦ "
style = "fg:nord15"
number_threshold = 1
symbol_threshold = 1

# ───────────────────────────────────────────────────────────────────────────────
# PACKAGE VERSION
# ───────────────────────────────────────────────────────────────────────────────
[package]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# NODE.JS
# ───────────────────────────────────────────────────────────────────────────────
# Навмисно вимкнено.
[nodejs]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# RUST
# ───────────────────────────────────────────────────────────────────────────────
[rust]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# GOLANG
# ───────────────────────────────────────────────────────────────────────────────
[golang]
disabled = true


# ───────────────────────────────────────────────────────────────────────────────
# KUBERNETES
# ───────────────────────────────────────────────────────────────────────────────
[kubernetes]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# JAVA
# ───────────────────────────────────────────────────────────────────────────────
[java]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# PHP
# ───────────────────────────────────────────────────────────────────────────────
[php]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# C
# ───────────────────────────────────────────────────────────────────────────────
[c]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# CPP
# ───────────────────────────────────────────────────────────────────────────────
[cpp]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# TERRAFORM
# ───────────────────────────────────────────────────────────────────────────────
[terraform]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# AWS
# ───────────────────────────────────────────────────────────────────────────────
[aws]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# AZURE
# ───────────────────────────────────────────────────────────────────────────────
[azure]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# GCP
# ───────────────────────────────────────────────────────────────────────────────
[gcloud]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# MEMORY USAGE
# ───────────────────────────────────────────────────────────────────────────────
[memory_usage]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
# BATTERY
# ───────────────────────────────────────────────────────────────────────────────
[battery]
disabled = true

# ───────────────────────────────────────────────────────────────────────────────
